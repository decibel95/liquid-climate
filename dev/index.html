<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Climate dev harness</title>
    <style>
      body { margin: 0; background: #0b0e14; color: #f4f6fa; font-family: system-ui, sans-serif; }
      main { position: relative; overflow: hidden; padding: 24px; }
      .blob { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; }
      .b1 { width: 520px; height: 520px; left: -160px; top: 80px; background: #24324a; opacity: 0.8; }
      .b2 { width: 460px; height: 460px; right: -160px; bottom: 60px; background: #1d3a3a; opacity: 0.7; }
      h1 { position: relative; font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.note { position: relative; margin: 0 0 20px; color: rgba(235, 240, 248, 0.65); font-size: 13px; }
      h2 { position: relative; font-size: 13px; font-weight: 500; color: rgba(235, 240, 248, 0.6); margin: 28px 0 12px; }
      #tiles { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 460px)); gap: 10px 28px; }
      #clusters { position: relative; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
      #clusters > * { flex: none; }
      #badges { position: relative; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      #grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 444px)); gap: 28px; align-items: start; }
      label.lang { position: relative; display: block; margin: 0 0 16px; font-size: 13px; color: rgba(235, 240, 248, 0.65); }
      label.lang select { margin-left: 8px; font: inherit; color: inherit; background: #1a1e26; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 4px 8px; }
      figure { margin: 0; }
      figcaption { margin: 0 0 8px 6px; font-size: 12px; color: rgba(235, 240, 248, 0.6); }
      #side { position: relative; margin-top: 32px; display: grid; grid-template-columns: minmax(320px, 520px) 1fr; gap: 28px; }
      #clusterEditorBox { margin-top: 20px; background: #1a1e26; border-radius: 16px; padding: 14px 18px; --primary-text-color: #f4f6fa; --secondary-text-color: rgba(235,240,248,.65); --divider-color: rgba(255,255,255,.14); --card-background-color: #11151c; --primary-color: #5ab0ff; }
      #editorBox { background: #1a1e26; border-radius: 16px; padding: 14px 18px; --primary-text-color: #f4f6fa; --secondary-text-color: rgba(235,240,248,.65); --divider-color: rgba(255,255,255,.14); --card-background-color: #11151c; --primary-color: #5ab0ff; }
      #log { margin: 0; background: #11151c; border-radius: 12px; padding: 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; min-height: 160px; max-height: 420px; overflow: auto; }
    </style>
  </head>
  <body>
    <main>
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <h1>Liquid Climate dev harness</h1>
      <p class="note">Fake hass built from the test fixtures. Service calls are logged and applied to the fake states after 0.8 s. Nothing talks to Home Assistant.</p>
      <label class="lang">Language <select id="lang"><option value="en">English</option><option value="nl">Nederlands</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option></select></label>
      <div id="grid"></div>
      <h2>Tiles</h2>
      <div id="tiles"></div>
      <h2>Cluster: wide, sections 12 columns (480px), sections 6 columns (240px)</h2>
      <div id="clusters"></div>
      <h2>Badges</h2>
      <div id="badges"></div>
      <section id="side">
        <div><div id="editorBox"></div><div id="clusterEditorBox"></div></div>
        <pre id="log" aria-live="polite">Service calls appear here.</pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
